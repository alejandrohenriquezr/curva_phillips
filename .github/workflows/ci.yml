name: Validar variante anual
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Pipeline anual completo
        run: python scripts/08_ejecutar_todo.py
      - name: Guardar productos
        uses: actions/upload-artifact@v4
        with:
          name: phillips-anual-${{ matrix.os }}
          path: |
            cuadernos_jupyter/**
            informes/**
            resultados/**
            site/**
          if-no-files-found: error
