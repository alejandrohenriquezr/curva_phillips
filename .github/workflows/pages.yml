name: Publicar análisis en GitHub Pages
on:
  push:
    branches: [main, codex/actualizacion-automatica-datos]
  workflow_dispatch:
  schedule:
    - cron: '37 13 * * 1'

env:
  TZ: America/Santiago
  PYTHONUTF8: '1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-completo.txt
      - name: Descargar fuentes oficiales y generar análisis firmado
        run: python orquestar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site_pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
