name: Verificar cuaderno Phillips
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-completo.txt
      - run: python instalar_x13.py
      - run: python orquestar.py --sin-actualizar-datos --ipc original
      - run: python orquestar.py --sin-actualizar-datos --ipc sa

  windows-install:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13'
      - name: Instalar con PowerShell de Windows
        shell: powershell
        env:
          PHILLIPS_PYTHON: ${{ steps.python.outputs.python-path }}
        run: .\instalar_entorno.ps1
      - name: Comprobar reutilizacion del entorno
        shell: powershell
        run: .\instalar_entorno.ps1 -SoloPreparar
      - name: Probar analisis y actualizacion
        shell: powershell
        env:
          PYTHONUTF8: '1'
        run: .\venv\Scripts\python.exe -m unittest test_phillips test_actualizar_datos test_ipc_x13 -v
  revisar-publicacion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-completo.txt pdf2image
      - name: Instalar renderizador del documento
        run: sudo apt-get update -qq && sudo apt-get install -y libreoffice-writer poppler-utils
      - name: Generar sitio e informe firmado
        run: python orquestar.py --sin-actualizar-datos
      - name: Renderizar Word para revision visual
        run: python tools/render_docx.py site_pages/articulo_linkedin.docx --output_dir qa_documento --emit_pdf
      - uses: actions/upload-artifact@v4
        with:
          name: revision-publicacion
          retention-days: 7
          path: |
            qa_documento/
            site_pages/
