name: Verificar cuaderno Phillips
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-notebook.txt
      - run: python -m unittest test_phillips -v
      - run: python verificar_cuaderno.py
