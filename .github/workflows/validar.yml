name: Verificar cuaderno Phillips
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-completo.txt
      - run: python instalar_x13.py
      - run: python orquestar.py --ipc original
      - run: python orquestar.py --ipc sa
