name: Actualizar fuentes INE y BCCh

on:
  schedule:
    - cron: '23 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: actualizar-fuentes
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-notebook.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-notebook.txt
      - name: Registrar cobertura anterior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from phillips import load_data
          data, coverage, _ = load_data()
          Path("cobertura_anterior.json").write_text(json.dumps({
              "desde": data.mes.iloc[0], "hasta": data.mes.iloc[-1],
              "fuentes": coverage.set_index("serie")[["desde", "hasta", "filas"]].to_dict("index")
          }), encoding="utf-8")
          PY
      - name: Descargar IPC, ENE, IR e IMACEC
        run: |
          python main.py
          python actualizar_imacec.py
      - name: Validar fuentes y cobertura del análisis
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from phillips import load_data
          old = json.loads(Path("cobertura_anterior.json").read_text(encoding="utf-8"))
          data, coverage, missing = load_data()
          if data.mes.iloc[0] > old["desde"] or data.mes.iloc[-1] < old["hasta"]:
              raise ValueError("La actualización reduce el período común")
          for row in coverage.itertuples(index=False):
              previous = old["fuentes"][row.serie]
              if row.desde > previous["desde"] or row.hasta < previous["hasta"] or row.filas < previous["filas"]:
                  raise ValueError(f"La actualización pierde cobertura: {row.serie}")
          out = Path("actualizacion")
          out.mkdir()
          coverage.to_csv(out / "cobertura.csv", index=False)
          missing.to_csv(out / "meses_excluidos.csv", index=False)
          data.to_csv(out / "datos_phillips.csv", index=False)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write(f"## Fuentes actualizadas\n\nPeríodo común: {data.mes.iloc[0]} a {data.mes.iloc[-1]} ({len(data)} meses).\n\n")
              report.write("Las conclusiones históricas y el informe requieren revisión si cambia la cobertura.\n")
          PY
      - name: Conservar fuentes y diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: fuentes-actualizadas
          retention-days: 30
          path: |
            ine_*_chile.csv
            bcch_imacec_chile.csv
            fuentes/imacec_metadata.json
            actualizacion/
      - name: Proponer actualización de los datos
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/actualizar-datos
          delete-branch: true
          commit-message: 'data: actualizar fuentes INE y BCCh'
          title: 'Actualizar datos de IPC, ENE, IR e IMACEC'
          body: |
            Actualización automática de las cuatro fuentes oficiales.
            Se validaron las series con phillips.load_data() y se comprobó que no se redujera su cobertura.
            El diagnóstico y los datos combinados están en el artefacto fuentes-actualizadas de la ejecución.

            Antes de integrar, revisar las revisiones históricas y el nuevo período común.
            Las pruebas actuales fijan el corte de junio de 2026 y el informe contiene conclusiones históricas:
            deben revisarse cuando aumente la cobertura. Este workflow no regenera ni publica el informe.
          add-paths: |
            ine_ipc_chile.csv
            ine_ene_chile.csv
            ine_ir_chile.csv
            bcch_imacec_chile.csv
            fuentes/imacec_metadata.json
